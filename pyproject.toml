[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-code-rescue-bench"
version = "0.1.0"
description = "Reproducible benchmark for deterministic evaluation of human and AI software repairs"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "typer>=0.16,<1", "httpx>=0.28,<1", "PyYAML>=6.0,<7", "rich>=14,<15"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]
tree-sitter = ["tree-sitter>=0.25,<1", "tree-sitter-python>=0.23,<1", "tree-sitter-javascript>=0.23,<1", "tree-sitter-typescript>=0.23,<1"]

[project.scripts]
rescuebench = "rescuebench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rescuebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["rescuebench"]
