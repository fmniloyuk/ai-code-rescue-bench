id: docker-service-localhost
title: Compose API connects to localhost instead of database service
stack: [Docker Compose, PostgreSQL, configuration]
defect_category: Docker/network configuration
difficulty: medium
security_implications: null
expected_behavior:
  - The API connects to the Compose database by service DNS name.
  - The database is not reached through host networking or host aliases.
  - Credentials, port, and database name remain otherwise unchanged.
sandbox: {image: rescuebench/config:local, cpus: 0.5, memory: 256m, pids: 48, timeout_seconds: 30}
checks:
  - {name: yaml parse, stage: build, command: [python, tests/validate.py, parse], weight: 10}
  - {name: visible service dns, stage: public, command: [python, tests/validate.py, contract], weight: 20}
  - {name: hidden compose semantics, stage: hidden, command: [python, /grader/grader.py, hidden], weight: 35}
  - {name: no host-network bypass, stage: security, command: [python, /grader/grader.py, security], weight: 15}
  - {name: compose shape, stage: quality, command: [python, /grader/grader.py, quality], weight: 10}
  - {name: url mutation, stage: mutation, command: [python, /grader/grader.py, mutation], weight: 10}
  - {name: credential regression, stage: regression, command: [python, /grader/grader.py, regression], weight: 0}
changed_lines_budget: 4
tags: [docker, networking, compose]
