name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    name: Core tests and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests tools scripts
      - name: Unit tests
        run: pytest
      - name: Validate all case manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          from rescuebench.catalog import BenchmarkCatalog

          cases = BenchmarkCatalog(Path.cwd()).summaries()
          assert len(cases) >= 15, f"expected at least 15 benchmark cases, got {len(cases)}"
          assert len({case.id for case in cases}) == len(cases)
          print(f"validated {len(cases)} benchmark manifests")
          PY

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        working-directory: web
        run: npm install --package-lock-only && npm ci
      - name: Typecheck and build dashboard
        working-directory: web
        run: npm run build

  benchmark-smoke:
    name: Sandboxed benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runner
        run: python -m pip install -e '.[dev]'
      - name: Build trusted evaluator images
        run: |
          docker build -f docker/patcher.Dockerfile -t rescuebench/patcher:local .
          docker build -f docker/python.Dockerfile -t rescuebench/python:local .
          docker build -f docker/config.Dockerfile -t rescuebench/config:local .
      - name: Verify Docker sandbox policy is available
        run: rescuebench doctor
      - name: Run deterministic Python security repair
        run: rescuebench agent py-fastapi-tenant-leak --provider mock --json
      - name: Run deterministic Docker configuration repair
        run: rescuebench agent docker-service-localhost --provider mock --json
      - name: Validate reference demonstrations and broken baselines
        run: python scripts/assert-reference-results.py py-fastapi-tenant-leak docker-service-localhost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-results
          path: artifacts/runs
          if-no-files-found: warn
