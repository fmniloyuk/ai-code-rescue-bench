id: py-resource-leak-stream
title: File descriptor leaked when async stream sender fails
stack: [Python, asyncio]
defect_category: memory/resource leak
difficulty: medium
security_implications: null
expected_behavior:
  - The opened file is closed when streaming succeeds.
  - The opened file is closed when the sender raises or the task is cancelled.
  - Chunk ordering and contents are unchanged.
